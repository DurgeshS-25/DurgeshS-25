name: Refresh contribution graph

on:
  schedule:
    - cron: "0 5 * * *"   # once a day, early morning UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r tools/requirements-daily.txt

      - run: python tools/pull_contributions.py "${{ github.repository_owner }}"

      - run: python tools/render_graph.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: refresh contribution graph [skip ci]"
          file_pattern: "assets/contributions.json graph.svg"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          
